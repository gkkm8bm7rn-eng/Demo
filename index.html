<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Temporary demo hosting period has ended.">
  <title>Demo expired</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body {
      min-height: 100vh;
      box-sizing: border-box;
      padding: 68px 12px 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #222;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    .notice {
      width: 100%;
      max-width: 370px;
      box-sizing: border-box;
      border: 1px solid #999;
      background: #fff;
    }
    .label {
      padding: 6px 10px;
      border-bottom: 1px solid #aaa;
      background: #f2f2f2;
      color: #444;
      font-size: 11px;
    }
    .content { padding: 11px 10px 13px; }
    h1 { margin: 0 0 6px; font-size: 13px; font-weight: 700; line-height: 1.4; }
    p { margin: 0; }
  </style>
</head>
<body>
  <main class="notice" role="alert" aria-labelledby="status-title">
    <div class="label">NOTICE</div>
    <div class="content">
      <h1 id="status-title">Demo expired</h1>
      <p>The temporary hosting period for this demo has ended.</p>
    </div>
  </main>
  <script>
    (async () => {
      const scope = new URL('/Demo/', location.origin).href;
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (registration.scope === scope) await registration.unregister();
          }
        } catch (_) {}
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('storefront:' + scope + ':')).map(key => caches.delete(key)));
        } catch (_) {}
      }
    })();
  </script>
</body>
</html>
