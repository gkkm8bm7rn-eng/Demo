<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Период временной публикации завершён.">
  <title>Период временной публикации завершён</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 760px;
      margin-top: 56px;
      border: 1px solid #323232;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
    }
    .topline {
      padding: 18px 24px;
      background: #2a2a2a;
      color: #bdbdbd;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 500;
      border-bottom: 1px solid #323232;
    }
    .content { padding: 34px 24px 38px; background: #000; }
    .icon { width: 36px; height: 36px; margin-bottom: 26px; color: #d7d7d7; }
    h1 {
      margin: 0 0 26px;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -0.03em;
      max-width: 620px;
    }
    p {
      margin: 0 0 22px;
      font-size: clamp(18px, 2.5vw, 26px);
      line-height: 1.38;
      color: #fff;
      max-width: 560px;
    }
    .muted { color: #b8b8b8; }
    .bottomline {
      padding: 18px 24px;
      background: #2a2a2a;
      color: #bdbdbd;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      border-top: 1px solid #323232;
    }
    @media (max-width: 640px) {
      body { padding: 16px; }
      .wrap { margin-top: 28px; border-radius: 14px; }
      .topline, .bottomline { padding: 16px 18px; }
      .content { padding: 28px 18px 30px; }
      .icon { margin-bottom: 22px; }
      h1 { margin-bottom: 22px; }
      p { margin-bottom: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="status-title">
    <div class="topline">Уведомление о статусе страницы</div>
    <div class="content">
      <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 10.7v5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="12" cy="7.6" r="1" fill="currentColor"/>
      </svg>
      <h1 id="status-title">Период временной публикации завершён</h1>
      <p>Ранее по этому адресу была опубликована демо-версия электронного каталога.</p>
      <p class="muted">Срок размещения истёк.</p>
    </div>
    <div class="bottomline">Страница недоступна</div>
  </main>
  <script>
    (async () => {
      const scope = new URL('/Demo/', location.origin).href;
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (registration.scope === scope) await registration.unregister();
          }
        } catch (_) {}
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('storefront:' + scope + ':')).map(key => caches.delete(key)));
        } catch (_) {}
      }
    })();
  </script>
</body>
</html>
